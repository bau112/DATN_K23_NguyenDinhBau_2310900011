
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tổng quan | NTU System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
    <aside class="sidebar" id="sidebar">
        <a class="brand" href="/dashboard.html">
            <span class="brand-mark">NTU</span>
            <span class="brand-copy">
                <strong>ĐẠI HỌC NGUYỄN TRÃI</strong>
                <small>HỆ THỐNG QUẢN LÝ ĐÀO TẠO</small>
            </span>
        </a>

        <nav class="sidebar-nav">
            <a href="/dashboard.html" class="nav-link active">
                <span class="nav-icon">⌂</span>
                <span>Tổng quan</span>
            </a>
        </nav>

        <button class="logout-button" id="logoutButton" type="button">
            <span>⇥</span>
            Đăng xuất
        </button>
    </aside>

    <main class="main-area">
        <header class="topbar">
            <div class="topbar-left">
                <button class="mobile-menu" id="mobileMenuButton" type="button">☰</button>

                <div class="search-box">
                    <span>⌕</span>
                    <input id="quickSearch" type="search" placeholder="Tìm chức năng nhanh...">
                    <kbd>Ctrl K</kbd>
                </div>
            </div>

            <div class="topbar-right">
                <span class="today" id="todayText"></span>

                <div class="user-block">
                    <div class="user-avatar" id="userAvatar">U</div>
                    <div class="user-details">
                        <strong id="userName">Đang tải...</strong>
                        <small id="userRole">...</small>
                    </div>
                </div>
            </div>
        </header>

        <div class="page-content" id="dashboardContent">
            <section class="page-intro">
                <div>
                    <p class="eyebrow">NTU · CỔNG QUẢN LÝ ĐÀO TẠO</p>
                    <h1>Đang tải tổng quan...</h1>
                    <p class="intro-text">Vui lòng chờ trong giây lát.</p>
                </div>
            </section>
        </div>
    </main>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <script src="/js/dashboard.js"></script>
</body>
</html>
